# 性能テスト（開発計画書 3-8、基本設計書 2.4）を、GitHub の Actions の画面のボタン（Run workflow）で動かす。
# Pull Request・push では動かさない（時間がかかり、毎回測る必要はないため）。手元で動かすコマンドは README「性能テスト」
#
# 測る先（base_url）を空にすると、ランナーの中で PostgreSQL・S3 の代わりの MinIO・公開用の jar（perf プロファイル）を起動し、
# データを入れてから測る。ランナーは EC2（t4g.micro）より速いので、数値は参考にする。
# 公開先の URL（CloudFront）を入れると、そこを測る。公開先のデータは先に入れておく（README「性能テスト」）
name: 性能テスト

on:
  # 一時的：PR の前にワークフローを確かめるため（確かめたら消す）
  push:
    branches: [feat/60-performance-tests]
  workflow_dispatch:
    inputs:
      base_url:
        description: 測る先の URL（空ならランナーの中で API を起動して測る。公開先は https://xxxx.cloudfront.net）
        required: false
        default: ""
      runs:
        description: 画面の項目を測る回数（20 回なら P95 は遅い方から 2 番目）
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  perf:
    name: 性能テスト（k6・Playwright）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PERF_BASE_URL: ${{ inputs.base_url || 'http://localhost:8080' }}
      PERF_RUNS: ${{ inputs.runs || '20' }}
      # 画像 4 枚の投稿（N-4）も測る
      PERF_UPLOAD: "1"
      # ランナーの中で測るときの S3 の代わり（MinIO）。API（S3_*）と aws コマンド（AWS_*）の両方に渡す
      S3_BUCKET: rt-images-perf
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: perf-minio
      S3_SECRET_KEY: perf-minio-secret
      AWS_ACCESS_KEY_ID: perf-minio
      AWS_SECRET_ACCESS_KEY: perf-minio-secret
      AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      - name: DB・MinIO を起動する
        if: inputs.base_url == ''
        run: |
          docker compose up -d db
          # 初回は DB を作る間、TCP では受け付けない一時のサーバーで動くので、TCP でつながるまで待つ
          timeout 60 sh -c 'until docker compose exec -T db pg_isready -q -h 127.0.0.1 -U raise_timeline; do sleep 1; done'
          docker compose exec -T db createdb -h 127.0.0.1 -U raise_timeline raise_timeline_perf
          # 自動テストと同じ MinIO（TestcontainersConfiguration と同じダイジェスト）
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            chainguard/minio@sha256:709099319add48dfb44aa596a7070d3ddd8dd04d7ae881765719aec29df9e510 server /data
          timeout 60 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'
          aws s3 mb "s3://$S3_BUCKET" --endpoint-url "$S3_ENDPOINT"

      - name: 公開用の jar を作って、perf プロファイルで起動する
        if: inputs.base_url == ''
        run: |
          (cd frontend && npm run build)
          (cd backend && ./mvnw -B -q package -Pwith-frontend -DskipTests)
          # EC2 と同じヒープの上限（技術スタック定義書 3.4）
          nohup java -Xmx384m -jar backend/target/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=perf \
            > perf/api.log 2>&1 &
          timeout 120 sh -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 2; done'

      - name: データを入れる
        if: inputs.base_url == ''
        working-directory: frontend
        run: npm run perf -- seed

      - name: 測る
        working-directory: frontend
        run: npm run perf -- all

      - name: 結果を Actions の画面に出す
        if: always()
        run: |
          if [ -f perf/results/summary.md ]; then cat perf/results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-results
          path: |
            perf/results/
            perf/api.log
          if-no-files-found: ignore
