components:
  schemas:
    Author:
      type: object
      properties:
        displayName:
          type: string
        iconUrl:
          type:
          - string
          - "null"
        username:
          type: string
      required:
      - displayName
      - iconUrl
      - username
    CommentView:
      type: object
      properties:
        author:
          $ref: "#/components/schemas/Author"
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        mine:
          type: boolean
      required:
      - author
      - body
      - createdAt
      - id
      - mine
    CommentsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommentView"
        nextCursor:
          type:
          - string
          - "null"
      required:
      - items
      - nextCursor
    CreateCommentRequest:
      type: object
      properties:
        body:
          type: string
          description: 改行を LF にそろえ、前後の空白を除いて 1〜280 文字（C-2）
      required:
      - body
    EditPostRequest:
      type: object
      properties:
        body:
          type: string
          description: 改行を LF にそろえ、前後の空白を除いて 280 文字まで（W-2）
      required:
      - body
    EditProfileRequest:
      type: object
      properties:
        bio:
          type: string
          description: 改行を LF にそろえ、前後の空白を除いて 160 文字まで。空でもよい（PF-7）
        displayName:
          type: string
          description: 前後の空白を除いて 1〜30 文字（PF-6）
      required:
      - bio
      - displayName
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        field:
          type:
          - string
          - "null"
        message:
          type: string
      required:
      - code
      - field
      - message
    FollowResult:
      type: object
      properties:
        followerCount:
          type: integer
          format: int64
        following:
          type: boolean
      required:
      - followerCount
      - following
    FollowsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        nextCursor:
          type:
          - string
          - "null"
      required:
      - items
      - nextCursor
    Image:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        url:
          type: string
      required:
      - expiresAt
      - id
      - url
    LikeResult:
      type: object
      properties:
        likeCount:
          type: integer
          format: int64
        liked:
          type: boolean
      required:
      - likeCount
      - liked
    LikersResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        nextCursor:
          type:
          - string
          - "null"
        totalCount:
          type: integer
          format: int64
      required:
      - items
      - nextCursor
      - totalCount
    LoginRequest:
      type: object
      properties:
        password:
          type: string
        username:
          type: string
      required:
      - password
      - username
    Me:
      type: object
      properties:
        displayName:
          type: string
        iconUrl:
          type:
          - string
          - "null"
        username:
          type: string
      required:
      - displayName
      - iconUrl
      - username
    PostView:
      type: object
      properties:
        author:
          $ref: "#/components/schemas/Author"
        body:
          type: string
        commentCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        editedAt:
          type:
          - string
          - "null"
          format: date-time
        id:
          type: integer
          format: int64
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        likeCount:
          type: integer
          format: int64
        likedByMe:
          type: boolean
        mine:
          type: boolean
      required:
      - author
      - body
      - commentCount
      - createdAt
      - editedAt
      - id
      - images
      - likeCount
      - likedByMe
      - mine
    Profile:
      type: object
      properties:
        bio:
          type: string
        displayName:
          type: string
        followedByMe:
          type: boolean
        followerCount:
          type: integer
          format: int64
        followingCount:
          type: integer
          format: int64
        iconUrl:
          type:
          - string
          - "null"
        joinedAt:
          type: string
          format: date-time
        me:
          type: boolean
        postCount:
          type: integer
          format: int64
        username:
          type: string
      required:
      - bio
      - displayName
      - followedByMe
      - followerCount
      - followingCount
      - iconUrl
      - joinedAt
      - me
      - postCount
      - username
    SignupRequest:
      type: object
      properties:
        displayName:
          type: string
          description: 前後の空白を除いて 1〜30 文字（A-4）
        password:
          type: string
          description: 8〜64 文字の半角文字で、英字と数字を 1 文字以上ずつ含む（A-3）
        username:
          type: string
          description: 前後の空白を除いて 3〜15 文字の半角英数字と「_」（A-2）
      required:
      - displayName
      - password
      - username
    TimelineResponse:
      type: object
      properties:
        followingCount:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostView"
        nextCursor:
          type:
          - string
          - "null"
      required:
      - items
      - nextCursor
    UrlsRequest:
      type: object
      properties:
        imageIds:
          type: array
          description: 画像の ID。50 個まで
          items:
            type: integer
            format: int64
      required:
      - imageIds
    UrlsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Image"
      required:
      - items
    UserSearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        nextOffset:
          type:
          - integer
          - "null"
          format: int32
      required:
      - items
      - nextOffset
    UserSummary:
      type: object
      properties:
        bioFirstLine:
          type: string
        displayName:
          type: string
        followedByMe:
          type: boolean
        iconUrl:
          type:
          - string
          - "null"
        me:
          type: boolean
        username:
          type: string
      required:
      - bioFirstLine
      - displayName
      - followedByMe
      - iconUrl
      - me
      - username
    UsernameAvailability:
      type: object
      properties:
        available:
          type: boolean
      required:
      - available
  securitySchemes:
    accessToken:
      description: ログイン（POST /api/auth/login）で受け取る JWT の Cookie（機能定義書 3.2）。GET 以外では、Cookie
        の XSRF-TOKEN の値を X-XSRF-TOKEN ヘッダーで送り返す（CSRF 対策）
      in: cookie
      name: access_token
      type: apiKey
