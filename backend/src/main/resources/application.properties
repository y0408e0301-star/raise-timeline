spring.application.name=backend

# 接続先の PostgreSQL。環境変数 DB_URL / DB_USERNAME / DB_PASSWORD があればそちらを使う
# （公開先のサーバーで使う）。なければ開発用の DB（../compose.yaml で起動）につなぐ
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/raise_timeline}
spring.datasource.username=${DB_USERNAME:raise_timeline}
spring.datasource.password=${DB_PASSWORD:raise_timeline}

# テーブルは Flyway（src/main/resources/db/migration）で作るので、JPA には作らせない
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT（アクセストークン）の署名に使う秘密の値（HS256。32 バイト以上）。
# 公開先では Parameter Store の値を環境変数 JWT_SECRET で渡す。下の既定値は開発用で、公開先では使わない
app.auth.jwt-secret=${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production}
# Cookie に Secure を付けるか。公開先（HTTPS）では環境変数 COOKIE_SECURE=true にする
app.auth.secure-cookie=${COOKIE_SECURE:false}

# 画像の置き場所（S3。機能定義書 FN-04、インフラ設計書 6 章）。公開先では環境変数 S3_BUCKET でバケットを渡す。
# 下の既定値は開発用のバケット。鍵は AWS の標準の探し方で探す（開発中は ~/.aws/credentials、公開先は EC2 の IAM ロール）。
# S3_ENDPOINT・S3_ACCESS_KEY・S3_SECRET_KEY は、S3 以外（テストの MinIO）につなぐときだけ使う
app.storage.bucket=${S3_BUCKET:rt-images-dev-467112307516}
app.storage.region=${AWS_REGION:ap-northeast-1}
app.storage.endpoint=${S3_ENDPOINT:}
app.storage.access-key=${S3_ACCESS_KEY:}
app.storage.secret-key=${S3_SECRET_KEY:}

# 送れる画像の大きさ（FN-04 4 章）：1 枚 5MB、1 回の送信で 21MB（画像 4 枚＋本文）。超えたら 413 IMAGE_TOO_LARGE。
# 上限を超えた送信でも 413 を返せるよう、Tomcat が読み捨てる量を 1 回の上限より大きくする
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=21MB
server.tomcat.max-swallow-size=25MB

# /actuator/health だけを公開する（公開した後の稼働の確認）。中身の詳しい情報は出さない
management.endpoints.web.exposure.include=health

# API の仕様書（OpenAPI。基本設計書 2.1）。/v3/api-docs と Swagger UI は、公開先では出さない（API の一覧を外に見せないため）。
# 開発中（mvnw spring-boot:run）は dev プロファイル（application-dev.properties）で出す
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.paths-to-match=/api/**
springdoc.writer-with-order-by-keys=true
springdoc.default-produces-media-type=application/json
# multipart の API（投稿・アイコン）の @RequestParam を、クエリではなく multipart の項目として書く
springdoc.default-support-form-data=true
