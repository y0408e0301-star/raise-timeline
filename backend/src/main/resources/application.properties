spring.application.name=backend

# 接続先の PostgreSQL。環境変数 DB_URL / DB_USERNAME / DB_PASSWORD があればそちらを使う
# （公開先のサーバーで使う）。なければ開発用の DB（../compose.yaml で起動）につなぐ
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/raise_timeline}
spring.datasource.username=${DB_USERNAME:raise_timeline}
spring.datasource.password=${DB_PASSWORD:raise_timeline}

# テーブルは Flyway（src/main/resources/db/migration）で作るので、JPA には作らせない
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT（アクセストークン）の署名に使う秘密の値（HS256。32 バイト以上）。
# 公開先では Parameter Store の値を環境変数 JWT_SECRET で渡す。下の既定値は開発用で、公開先では使わない
app.auth.jwt-secret=${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production}
# Cookie に Secure を付けるか。公開先（HTTPS）では環境変数 COOKIE_SECURE=true にする
app.auth.secure-cookie=${COOKIE_SECURE:false}

# /actuator/health だけを公開する（ALB のヘルスチェック）。中身の詳しい情報は出さない
management.endpoints.web.exposure.include=health
