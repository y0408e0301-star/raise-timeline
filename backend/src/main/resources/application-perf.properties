# 性能テスト（開発計画書 3-8、基本設計書 2.4）を手元で動かすときの設定。
# 公開用の jar を java -jar … --spring.profiles.active=perf で起動したときだけ使う（README「性能テスト」）。
# 開発用の DB を性能テストのデータ（ユーザー 1,000 人・投稿 1 万件など）で埋めないよう、
# 同じ PostgreSQL（compose.yaml の 5432）の中の別の DB raise_timeline_perf につなぐ。ポートは 8080 のまま変えない
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/raise_timeline_perf}
